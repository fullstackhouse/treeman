# Vets the code we are about to build, using tooling that is free for public
# repos — which this fork is. Three questions, each answered mechanically:
#
#   1. Is upstream's security hygiene getting worse?  (scorecard vs a baseline)
#   2. Do our dependencies have known vulnerabilities? (osv-scanner)
#   3. Is our fork still additive-only?                (diff vs upstream)
#
# None of this proves upstream code is benign — Scorecard measures practices,
# not intent. It is a prior and a drift detector, not a verdict. See FORK.md.
#
# Every job runs under Harden-Runner in `block` mode with its own allowlist,
# harvested from the audit-mode run of 2026-10-08 (the audit logs name every
# endpoint and the process that called it, so no dashboard is needed). Runner
# and Actions-cache infrastructure is allowed implicitly by the agent and is
# deliberately not listed — those hostnames are region- and shard-specific and
# would rot. When a job legitimately needs a new endpoint it fails with the
# blocked hostname in its log; add it here, in a commit that says why.
name: fsh vet

on:
  pull_request:            # the sync PR is the only door unreviewed code comes through
  push:
    branches: [fsh]
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "41 5 * * *"   # after fsh-sync, so a nightly upstream move is vetted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsh-vet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does our fork still consist of upstream plus our own files, and nothing else?
  # Additive-only is what keeps rebases free and makes "it is upstream's code"
  # a checkable claim rather than an intention.
  additive-only:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Assert the fork touches only its own files
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/stubbedev/treeman.git
          git fetch --quiet upstream master
          # Files we are allowed to add or change on top of upstream. Anything
          # else means we have started editing his tree — which is a decision,
          # not an accident, so it has to be made here, in this list.
          allowed='^(FORK\.md|PATCHES\.md|\.fsh/|\.github/workflows/fsh-)'
          base="$(git merge-base HEAD upstream/master)"
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::the fork diverges from upstream outside its own files:"
            echo "$unexpected"
            echo
            echo "If this is deliberate, add a PATCHES.md row (what, why, upstream PR,"
            echo "delete-when) and extend the allowlist in this workflow."
            exit 1
          fi
          echo "additive-only: OK — $(git diff --name-only "$base"..HEAD | wc -l) file(s), all ours"

  # Known vulnerabilities in upstream's dependencies. Scorecard counts them;
  # this names them, and fails only on ones that are NEW since the baseline —
  # upstream ships 40 today and a permanently red check is a check we ignore.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install osv-scanner (pinned, built from source)
        # Built here rather than taken from a release, for the same reason this
        # fork exists at all. go.sum verification covers its own dependencies.
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@e840a6e8adb14b7777c78e26cfbf6e2abc1d1fc6 # v2.6.0

      - name: Scan and compare against the baseline
        run: |
          set -euo pipefail
          # osv-scanner exits non-zero when it finds anything, which it always
          # will; the verdict is the comparison, not its exit code.
          osv-scanner scan source --lockfile=go.mod --format=json > /tmp/osv.json || true
          python3 .fsh/osv.py compare .fsh/upstream-osv.json /tmp/osv.json \
            >> "$GITHUB_STEP_SUMMARY"

  # Has upstream's hygiene regressed since we last looked? A drop in
  # Token-Permissions, Dangerous-Workflow or Pinned-Dependencies is exactly the
  # shape a hostile or careless change to his release path would take.
  upstream-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            codeload.github.com:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            www.bestpractices.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install scorecard (pinned)
        run: go install github.com/ossf/scorecard/v5@fac1a1678517b7185cd1fa24699a16423fd841d2 # v5.5.0

      - name: Score upstream and compare against the baseline
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scorecard --repo=github.com/stubbedev/treeman --format=json > /tmp/now.json
          python3 .fsh/compare-scorecard.py .fsh/upstream-scorecard.json /tmp/now.json \
            >> "$GITHUB_STEP_SUMMARY"

  # Our own fork's practices, published to this repo's code scanning. Free for
  # public repos. publish_results is off: the public OpenSSF dataset should
  # carry upstream's score, not a fork's.
  self:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            codeload.github.com:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            www.bestpractices.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: scorecard.sarif
