name: composer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.1', '8.5']
        # setup-php cannot install PHP 8.5 on macOS runners (brew install
        # fails silently on both macos-15 and macos-26 as of 2026-10-08);
        # cover the newest working minor there, 8.5 stays on Linux.
        exclude:
          - os: macos-latest
            php: '8.5'
        include:
          - os: macos-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pcntl, zlib
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: |
          php -l composer/Bootstrap.php
          php -l composer/bin/treeman
          php -l composer/bin/treemand
          php -l composer/tests/run.php
          php composer/tests/run.php
