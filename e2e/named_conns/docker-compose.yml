services:
  pg-main:
    image: postgres:16-alpine
    container_name: treeman-e2e-nc-main
    environment:
      POSTGRES_PASSWORD: pgpw
      POSTGRES_USER: postgres
    ports:
      - "15441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  pg-reporting:
    image: postgres:16-alpine
    container_name: treeman-e2e-nc-rep
    environment:
      POSTGRES_PASSWORD: pgpw
      POSTGRES_USER: postgres
    ports:
      - "15442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
